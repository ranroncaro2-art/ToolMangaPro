<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOOL MANGA ANIME PRO</title>
  <style>
    body {
      background-color: #070b13;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .neon-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }
    .container {
      text-align: center;
      z-index: 2;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.2);
      margin-bottom: 24px;
      animation: pulse-soft 2.2s infinite ease-in-out;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: 0 0 6px 0;
      background: linear-gradient(to right, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin: 0 0 32px 0;
      font-weight: 700;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(139, 92, 246, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      margin: 0 auto;
    }
    .status-text {
      margin-top: 14px;
      font-size: 11px;
      color: #475569;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.96); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="neon-glow"></div>
  <div class="container">
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" />
        <rect x="9" y="9" width="6" height="6" />
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" />
      </svg>
    </div>
    <h2>TOOL MANGA ANIME PRO</h2>
    <p>Hệ thống đang khởi động</p>
    <div class="spinner"></div>
    <div class="status-text">Đang tải tài nguyên hệ thống...</div>
  </div>
</body>
</html>
